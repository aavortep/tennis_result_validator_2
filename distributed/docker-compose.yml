services:
  postgres:
    image: postgres:15-alpine
    container_name: tennis-db-distr
    environment:
      POSTGRES_DB: ${DB_NAME:-tennis_tournament}
      POSTGRES_USER: ${DB_USER:-tennis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tennis_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "7432:7432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tennis_user} -d ${DB_NAME:-tennis_tournament}"]
      interval: 5s
      timeout: 5s
      retries: 5

  users-service:
    build:
      context: .
      dockerfile: users-service/Dockerfile
    container_name: users-service
    volumes:
      - ./users-service:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  tournaments-service:
    build:
      context: .
      dockerfile: tournaments-service/Dockerfile
    container_name: tournaments-service
    volumes:
      - ./tournaments-service:/app
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  results-service:
    build:
      context: .
      dockerfile: results-service/Dockerfile
    container_name: results-service
    volumes:
      - ./results-service:/app
    ports:
      - "8002:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  publication-service:
    build:
      context: .
      dockerfile: publication-service/Dockerfile
    container_name: publication-service
    volumes:
      - ./publication-service:/app
    ports:
      - "8003:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
